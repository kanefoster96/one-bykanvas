<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  /* The share card: the brand, what we do, and how it works - one image.
     1200x630, the Open Graph size every platform agrees on. */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#f5f5f7;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
  }
  .card{
    width:1200px;height:630px;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 80px;
  }
  .logo{
    font-size:118px;font-weight:600;letter-spacing:-.045em;color:#1d1d1f;line-height:1;
  }
  .by{
    margin-top:14px;font-size:19px;font-weight:500;color:#86868b;
    text-transform:uppercase;letter-spacing:.42em;text-indent:.42em;
  }
  .line{
    margin-top:42px;font-size:41px;font-weight:600;letter-spacing:-.02em;color:#1d1d1f;
  }
  .how{
    margin-top:56px;font-size:17px;font-weight:600;color:#86868b;
    text-transform:uppercase;letter-spacing:.14em;
  }
  .typebox{
    display:flex;align-items:center;gap:16px;
    width:640px;margin:18px auto 0;
    padding:18px 18px 18px 30px;
    background:#fff;border:2px solid #e3e3e8;border-radius:999px;
    box-shadow:0 16px 44px rgba(17,17,17,.09);
    text-align:left;
  }
  .typebox-text{
    flex:1;white-space:nowrap;font-size:23px;color:#1d1d1f;line-height:1.4;
  }
  .typebox-text::after{
    content:"";display:inline-block;width:3px;height:1.05em;
    margin-left:4px;vertical-align:-0.15em;border-radius:1.5px;background:#1d1d1f;
  }
  .typebox-send{
    flex:0 0 auto;display:grid;place-items:center;
    width:52px;height:52px;border-radius:50%;background:#1d1d1f;color:#fff;
  }
  .typebox-send svg{width:23px;height:23px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">one.</div>
    <div class="by">by Kanvas</div>
    <div class="line">The right website for your business.</div>
    <div class="how">If you need it, we&rsquo;ll build it</div>
    <div class="typebox">
      <span class="typebox-text">Add online payments to my site</span>
      <span class="typebox-send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5.5 11.5 12 5l6.5 6.5"/></svg></span>
    </div>
  </div>
</body>
</html>
