<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  /* The share card, in the homepage's clear hero order: the brand, a quiet
     pill, the outcome, three ticks. 1200x630, the Open Graph size every
     platform agrees on. Render it from the site root so the font loads. */
  @font-face{font-family:"Geist";src:url("/assets/fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#fff;font-family:"Geist",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;color:#1d1d1f}
  .card{
    width:1200px;height:630px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 80px;
  }
  .logo{font-size:96px;font-weight:700;letter-spacing:-.045em;line-height:1}
  /* The full stop drawn as a circle in the orange gradient, as on the site. */
  .logo .dot{display:inline-block;width:.17em;height:.17em;border-radius:50%;background:linear-gradient(135deg,#c93e09,#ff4f12)}
  .pill{
    display:inline-flex;align-items:center;gap:12px;margin-top:40px;
    padding:10px 22px 10px 16px;border-radius:999px;background:#f5f5f7;box-shadow:inset 0 0 0 1.5px #e8e8ed;
    font-size:22px;font-weight:600;
  }
  .pill::before{content:"";width:12px;height:12px;border-radius:50%;background:#ff5a1f}
  .line{margin-top:26px;font-size:66px;font-weight:700;letter-spacing:-.035em;line-height:1.05}
  .line span{color:#ff4f12}
  .ticks{display:flex;gap:34px;margin-top:38px;font-size:23px;font-weight:500}
  .ticks div{display:flex;align-items:center;gap:12px}
  .ticks svg{width:34px;height:34px;padding:7px;border-radius:50%;background:rgba(201,62,9,.1);color:#c93e09}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">one<span class="dot"></span></div>
    <div class="pill">Not just class management software</div>
    <div class="line">Full classes. <span>Your evenings back.</span></div>
    <div class="ticks">
      <div><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Your own app and website</div>
      <div><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Ads that bring families in</div>
      <div><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Admin that runs itself</div>
    </div>
  </div>
</body>
</html>
