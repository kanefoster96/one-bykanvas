<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in — Kanvas One</title>
<meta name="description" content="Log in to your Kanvas One account, or create one to get your business online.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=48">
</head>
<body class="auth-body">

<header class="nav">
  <div class="nav-inner">
    <a class="logo" href="/" aria-label="Kanvas One — home">one.</a>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title" id="title">Log in</h1>
    <p class="auth-sub" id="subtitle">Welcome back.</p>

    <div class="seg" id="tabs" role="tablist" aria-label="Log in or create an account">
      <button class="seg-btn is-on" id="tab-login"  type="button" role="tab" aria-selected="true">Log in</button>
      <button class="seg-btn"       id="tab-signup" type="button" role="tab" aria-selected="false">Create account</button>
    </div>

    <form id="form" novalidate>
      <div class="hp" aria-hidden="true">
        <label for="auth_extra">Leave this empty</label>
        <input id="auth_extra" name="auth_extra" type="text" tabindex="-1" autocomplete="off">
      </div>
      <div class="field signup-only" hidden>
        <label for="business">Business name</label>
        <input id="business" name="business" type="text" autocomplete="organization">
      </div>
      <div class="field signup-only" hidden>
        <label for="contact">Your name</label>
        <input id="contact" name="contact" type="text" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field" id="passwordField">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="hint signup-only" hidden>At least 8 characters.</p>
      </div>

      <label class="mail-pref signup-only" id="marketingOptIn" hidden>
        <input type="checkbox" id="marketingBox" checked>
        <span>Email me occasional tips, offers and new features. Unsubscribe any time.</span>
      </label>

      <button class="btn btn-primary full" id="submit" type="submit">Log in</button>
      <p class="hint legal-consent signup-only" hidden>By creating an account you agree to our
        <a href="/terms.html">terms of service</a> and <a href="/privacy.html">privacy notice</a>.</p>
      <p class="note" id="note" role="status" aria-live="polite"></p>
    </form>

    <button class="linkish" id="forgot" type="button">Forgotten your password?</button>
    <button class="linkish" id="backToLogin" type="button" hidden>Back to log in</button>
  </div>

  <p class="auth-foot">Not got a site with us yet? <a href="/how-it-works.html">See how it works</a></p>

<nav class="mini-legal" aria-label="Legal">
  <a href="/terms.html">Terms</a>
  <a href="/privacy.html">Privacy</a>
  <a href="/cookies.html">Cookies</a>
  <a href="/contact.html">Contact</a>
  <button class="linkish-foot" type="button" data-consent-open hidden>Cookie settings</button>
</nav>
</main>

<script src="vendor/supabase.js?v=1"></script>
<script src="consent.js?v=3"></script>
<script src="supabase-config.js?v=1"></script>
<script src="supabase-client.js?v=1"></script>
<script src="session.js?v=3"></script>
<script src="auth.js?v=5"></script>
<script src="admin-pill.js?v=8"></script>
</body>
</html>
