<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in — one</title>
<meta name="description" content="Log in to your one account, or create one to get your business online.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body class="auth-body">

<header class="nav">
  <div class="nav-inner">
    <a class="logo" href="/" aria-label="one, by Kanvas — home">one.</a>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title" id="title">Log in</h1>
    <p class="auth-sub" id="subtitle">Welcome back.</p>

    <div class="seg" role="tablist" aria-label="Log in or create an account">
      <button class="seg-btn is-on" id="tab-login"  type="button" role="tab" aria-selected="true">Log in</button>
      <button class="seg-btn"       id="tab-signup" type="button" role="tab" aria-selected="false">Create account</button>
    </div>

    <form id="form" novalidate>
      <div class="field signup-only" hidden>
        <label for="business">Business name</label>
        <input id="business" name="business" type="text" autocomplete="organization">
      </div>
      <div class="field signup-only" hidden>
        <label for="contact">Your name</label>
        <input id="contact" name="contact" type="text" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="hint signup-only" hidden>At least 8 characters.</p>
      </div>

      <button class="btn btn-primary full" id="submit" type="submit">Log in</button>
      <p class="note" id="note" role="status" aria-live="polite"></p>
    </form>

    <button class="linkish" id="forgot" type="button">Forgotten your password?</button>
  </div>

  <p class="auth-foot">Not got a site with us yet? <a href="/">See how it works</a></p>
</main>

<script src="vendor/supabase.js?v=1"></script>
<script src="supabase-config.js?v=1"></script>
<script src="supabase-client.js?v=1"></script>
<script src="session.js?v=1"></script>
<script src="auth.js?v=1"></script>
<script src="admin-pill.js?v=2"></script>
</body>
</html>
